<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레이저장비도감 v1.0</title>
<style>
:root {
  --bg: #f8f9fa; --surface: #fff; --border: #e2e8f0; --text: #1a202c;
  --text2: #4a5568; --text3: #718096; --primary: #3b82f6;
  --candela: #0057a8; --competitor: #6b7280;
  --tag-bg: #eef2ff; --tag-text: #3730a3;
  --badge-500: #d97706; --badge-700: #7c3aed;
  --badge-1000a: #059669; --badge-1000b: #0891b2;
  --pulse-long: #dc2626; --pulse-qs: #9333ea; --pulse-pico: #0ea5e9;
  --pulse-ipl: #f59e0b; --pulse-nafl: #10b981;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #f1f5f9;
    --text2: #cbd5e1; --text3: #94a3b8; --tag-bg: #1e1b4b; --tag-text: #a5b4fc;
    --candela: #60a5fa; --competitor: #9ca3af;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Header ── */
header { background: linear-gradient(135deg, #0057a8, #1d4ed8); color: #fff; padding: 20px 24px 16px; }
header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
header p { font-size: 0.8rem; opacity: 0.75; margin-top: 4px; }
.meta-bar { display: flex; gap: 16px; margin-top: 10px; font-size: 0.75rem; opacity: 0.7; }

/* ── Filters ── */
.filter-section { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; position: sticky; top: 0; z-index: 10; }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 0.7rem; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; min-width: 52px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  padding: 4px 12px; border-radius: 999px; font-size: 0.72rem; cursor: pointer;
  border: 1.5px solid var(--border); background: var(--bg); color: var(--text2);
  transition: all 0.15s; white-space: nowrap; user-select: none;
}
.pill:hover { border-color: var(--primary); color: var(--primary); }
.pill.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
.pill.all-pill { font-weight: 600; }

.filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.divider { width: 1px; height: 24px; background: var(--border); }

/* ── Stats bar ── */
.stats-bar { padding: 10px 24px; font-size: 0.75rem; color: var(--text3); background: var(--bg); border-bottom: 1px solid var(--border); }
.count-badge { display: inline-block; background: var(--primary); color: #fff; border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 0.7rem; margin-right: 4px; }

/* ── Grid ── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 20px 24px; }

/* ── Card ── */
.card {
  background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px;
  overflow: hidden; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.card.candela { border-left: 4px solid var(--candela); }
.card.competitor { border-left: 4px solid #9ca3af; }
.card.expanded { border-color: var(--primary); }

.card-header { padding: 14px 16px 10px; }
.brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.brand-name { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; }
.brand-name.candela { color: var(--candela); }
.brand-name.competitor { color: var(--text3); }
.device-name { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.2; }

/* ── Wavelength bars ── */
.wl-bars { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.wl-bar {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; color: #fff;
}
.wl-500 { background: var(--badge-500); }
.wl-700 { background: var(--badge-700); }
.wl-1000a { background: var(--badge-1000a); }
.wl-1000b { background: var(--badge-1000b); }
.wl-ipl { background: #f59e0b; }

/* ── Pulse badges ── */
.pulse-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
.pulse-badge {
  padding: 2px 8px; border-radius: 4px; font-size: 0.63rem; font-weight: 700; color: #fff;
}
.pulse-long_pulse { background: var(--pulse-long); }
.pulse-qswitch { background: var(--pulse-qs); }
.pulse-pico { background: var(--pulse-pico); }
.pulse-ipl { background: var(--pulse-ipl); color: #1a1a1a; }
.pulse-nafl { background: var(--pulse-nafl); }

/* ── Indication chips ── */
.ind-row { display: flex; flex-wrap: wrap; gap: 4px; }
.ind-chip {
  background: var(--tag-bg); color: var(--tag-text);
  padding: 2px 7px; border-radius: 4px; font-size: 0.63rem; font-weight: 500;
}

/* ── Expand detail ── */
.card-detail { display: none; padding: 0 16px 14px; border-top: 1px solid var(--border); margin-top: 10px; }
.card.expanded .card-detail { display: block; }
.detail-section { margin-top: 12px; }
.detail-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text3); letter-spacing: 0.05em; margin-bottom: 6px; }
.feature-list { list-style: none; }
.feature-list li { font-size: 0.75rem; color: var(--text2); padding: 2px 0; padding-left: 12px; position: relative; }
.feature-list li::before { content: "·"; position: absolute; left: 0; color: var(--primary); font-weight: 700; }
.notes-box { background: var(--bg); border-radius: 6px; padding: 8px 10px; font-size: 0.72rem; color: var(--text2); margin-top: 6px; }
.intel-box { background: #fef3c7; border-radius: 6px; padding: 8px 10px; font-size: 0.72rem; color: #92400e; margin-top: 6px; }
@media (prefers-color-scheme: dark) {
  .intel-box { background: #292524; color: #fbbf24; }
}
.param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.param-item { background: var(--bg); border-radius: 6px; padding: 6px 10px; }
.param-key { font-size: 0.62rem; color: var(--text3); }
.param-val { font-size: 0.78rem; font-weight: 600; color: var(--text); margin-top: 2px; }
.src-line { font-size: 0.62rem; color: var(--text3); margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border); }

/* ── Empty state ── */
.empty { text-align: center; padding: 60px; color: var(--text3); font-size: 0.9rem; grid-column: 1/-1; }

/* ── Legend ── */
.legend { padding: 12px 24px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.68rem; color: var(--text3); border-top: 1px solid var(--border); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }

/* ── Mobile ── */
.filter-toggle { display: none; }
.filter-body { display: block; }

@media (max-width: 768px) {
  header { padding: 12px 16px 10px; }
  header h1 { font-size: 1.2rem; }
  .meta-bar { gap: 10px; font-size: 0.7rem; }

  /* 필터: sticky 해제, 접이식으로 */
  .filter-section { position: relative; top: auto; padding: 0; }
  .filter-toggle {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    color: var(--text); background: var(--surface); border: none; width: 100%;
    text-align: left; -webkit-tap-highlight-color: transparent;
  }
  .filter-toggle-left { display: flex; align-items: center; gap: 8px; }
  .filter-active-count {
    background: var(--primary); color: #fff; border-radius: 999px;
    font-size: 0.65rem; font-weight: 700; padding: 1px 7px;
  }
  .filter-body { display: none; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
  .filter-body.open { display: block; }
  .filter-row { margin-bottom: 10px; flex-direction: column; align-items: flex-start; gap: 6px; }
  .filter-label { min-width: auto; }
  .pills { gap: 5px; }
  .pill { padding: 5px 11px; font-size: 0.75rem; min-height: 32px; touch-action: manipulation; }

  /* 그리드: 1열 */
  .grid { grid-template-columns: 1fr; padding: 12px; gap: 10px; }
  .stats-bar { padding: 8px 16px; }
  .param-grid { grid-template-columns: 1fr 1fr; }
  .legend { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>🔬 레이저장비도감</h1>
  <p>파장·펄스모드·적응증·제조사별 분류 — 영업 현장 인텔 통합</p>
  <div class="meta-bar">

<div class="stats-bar">

  <span class="legend-item"><span class="legend-dot" style="background:var(--badge-700)"></span>700대 (700–999nm)</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--badge-1000a)"></span>1000초반 (1000–1399nm)</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--badge-1000b)"></span>1000후반 (1400nm+)</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--pulse-ipl)"></span>IPL</span>
  <span style="margin-left:8px;font-weight:700;color:var(--text2)">펄스:</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--pulse-long)"></span>롱펄스</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--pulse-qs)"></span>큐스위치</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--pulse-pico)"></span>피코</span>
  <span class="legend-item"><span class="legend-dot" style="background:var(--pulse-nafl)"></span>NAFL</span>
</div>

const devices = DATA.devices;

// ── 필터 상태 ──
const filters = { wl: 'all', pulse: 'all', ind: 'all', brand: 'all' };

// ── 옵션 집합 ──
const wlCats = ['500대', '700대', '1000초반', '1000후반'];
const pulseModes = [...new Set(devices.flatMap(d => d.pulse_modes))];
const indCats = [...new Set(devices.flatMap(d => d.indications))];
const indLabels = {};
devices.forEach(d => d.indications.forEach((k,i) => { indLabels[k] = d.indication_labels[i]; }));
const brands = [...new Set(devices.map(d => d.brand))];

const pulseLabel = { long_pulse:'롱펄스', qswitch:'큐스위치', pico:'피코', ipl:'IPL', nafl:'NAFL' };
const wlClass = { '500대':'wl-500','700대':'wl-700','1000초반':'wl-1000a','1000후반':'wl-1000b','IPL':'wl-ipl' };

// ── wavelength → category helper ──
function wlToCategories(wl) {
  if (wl < 500) return ['500대'];
  if (wl < 700) return ['500대'];
  if (wl < 1000) return ['700대'];
  if (wl < 1400) return ['1000초반'];
  return ['1000후반'];
}

// ── 필 생성 ──
function makePills(containerId, items, key, labelFn) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'pill all-pill active'; allBtn.textContent = '전체'; allBtn.dataset.val = 'all';
  allBtn.onclick = () => setFilter(key, 'all', containerId);
  el.appendChild(allBtn);
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'pill'; btn.textContent = labelFn(item); btn.dataset.val = item;
    btn.onclick = () => setFilter(key, item, containerId);
    el.appendChild(btn);
  });
}

function setFilter(key, val, containerId) {
  filters[key] = val;
  document.querySelectorAll('#' + containerId + ' .pill').forEach(p => {
    p.classList.toggle('active', p.dataset.val === val);
  });
  updateFilterBadge();
  render();
}

function resetFilters() {
  Object.keys(filters).forEach(k => filters[k] = 'all');
  ['wl-pills','pulse-pills','ind-pills','brand-pills'].forEach(id => {
    document.querySelectorAll('#' + id + ' .pill').forEach(p => {
      p.classList.toggle('active', p.dataset.val === 'all');
    });
  });
  updateFilterBadge();
  render();
}

function toggleFilterPanel() {
  const body = document.getElementById('filterBody');
  const arrow = document.getElementById('filterArrow');
  const isOpen = body.classList.toggle('open');
  arrow.textContent = isOpen ? '▲' : '▼';
}

function updateFilterBadge() {
  const activeCount = Object.values(filters).filter(v => v !== 'all').length;
  const badge = document.getElementById('activeFilterCount');
  if (badge) {
    badge.style.display = activeCount > 0 ? 'inline-block' : 'none';
    badge.textContent = activeCount;
  }
}

// ── 카드 HTML ──
function cardHTML(d) {
  const isCandelaClass = d.brand_category === 'candela' ? 'candela' : 'competitor';

  // wavelength bars — use device's own wavelength_categories
  const wlCatSet = [...new Set(d.wavelength_categories)];
  const wlBars = wlCatSet.map(cat => {
    const cls = wlClass[cat] || 'wl-ipl';
    // find matching wavelength labels
    const matchLabels = d.wavelength_labels.filter((_,i) => {
      const w = d.wavelengths[i];
      if (!w) return false;
      if (cat === '500대') return w >= 400 && w < 700;
      if (cat === '700대') return w >= 700 && w < 1000;
      if (cat === '1000초반') return w >= 1000 && w < 1400;
      if (cat === '1000후반') return w >= 1400;
      return false;
    });
    const label = matchLabels.length > 0 ? matchLabels[0].split(' ')[0] : cat;
    return `<span class="wl-bar ${cls}">${label}</span>`;
  }).join('');

  // IPL/NAFL extra bars
  const extraBars = d.pulse_modes.includes('ipl') ? '<span class="wl-bar wl-ipl">IPL(SWT)</span>' : '';

  const pulseBadges = d.pulse_modes.map(p =>
    `<span class="pulse-badge pulse-${p}">${pulseLabel[p] || p}</span>`
  ).join('');

  const indChips = d.indication_labels.map(l => `<span class="ind-chip">${l}</span>`).join('');

  const features = (d.key_features || []).map(f => `<li>${f}</li>`).join('');
  const notes = d.notes ? `<div class="notes-box">📝 ${d.notes}</div>` : '';
  const intel = d.field_intel ? `<div class="intel-box">🔍 현장 인텔: ${d.field_intel}</div>` : '';

  const params = `
    <div class="param-grid">
      ${d.spot_sizes_mm ? `<div class="param-item"><div class="param-key">스팟사이즈</div><div class="param-val">${d.spot_sizes_mm.join(', ')}mm</div></div>` : ''}
      ${d.fluence_range ? `<div class="param-item"><div class="param-key">플루언스</div><div class="param-val">${d.fluence_range.min}~${d.fluence_range.max} ${d.fluence_range.unit}</div></div>` : ''}
      ${d.pulse_width_range ? `<div class="param-item"><div class="param-key">펄스폭</div><div class="param-val">${d.pulse_width_range.min}~${d.pulse_width_range.max} ${d.pulse_width_range.unit}</div></div>` : ''}
      ${d.cooling ? `<div class="param-item"><div class="param-key">냉각</div><div class="param-val">${d.cooling.join(', ')}</div></div>` : ''}
    </div>
  `;

  return `
    <div class="card ${isCandelaClass}" data-id="${d.id}" onclick="toggleCard('${d.id}')">
      <div class="card-header">
        <div class="brand-row">
          <span class="brand-name ${isCandelaClass}">${d.brand}</span>
        </div>
        <div class="device-name">${d.name}</div>
        <div class="wl-bars" style="margin-top:8px">${wlBars}${extraBars}</div>
        <div class="pulse-row">${pulseBadges}</div>
        <div class="ind-row">${indChips}</div>
      </div>
      <div class="card-detail">
        <div class="detail-section">
          <div class="detail-label">핵심 스펙</div>
          ${params}
        </div>
        ${features ? `<div class="detail-section"><div class="detail-label">주요 특징</div><ul class="feature-list">${features}</ul></div>` : ''}
        ${notes}
        ${intel}
        <div class="src-line">출처: ${d.source} | 등록: ${d.date_added}</div>
      </div>
    </div>
  `;
}

// ── 필터 적용 ──
function filteredDevices() {
  return devices.filter(d => {
    if (filters.wl !== 'all' && !d.wavelength_categories.includes(filters.wl)) return false;
    if (filters.pulse !== 'all' && !d.pulse_modes.includes(filters.pulse)) return false;
    if (filters.ind !== 'all' && !d.indications.includes(filters.ind)) return false;
    if (filters.brand !== 'all' && d.brand !== filters.brand) return false;
    return true;
  });
}

// ── 렌더 ──
function render() {
  const list = filteredDevices();
  const grid = document.getElementById('deviceGrid');
  document.getElementById('showCount').textContent = list.length;
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty">조건에 맞는 장비가 없습니다. 필터를 바꿔보세요.</div>';
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

function toggleCard(id) {
  const el = document.querySelector('[data-id="' + id + '"]');
  if (el) el.classList.toggle('expanded');
}

// ── 초기화 ──
document.getElementById('totalCount').textContent = devices.length;
makePills('wl-pills', wlCats, 'wl', x => x);
makePills('pulse-pills', pulseModes, 'pulse', x => pulseLabel[x] || x);
makePills('ind-pills', indCats, 'ind', x => indLabels[x] || x);
makePills('brand-pills', brands, 'brand', x => x);
render();
</script>
</body>
</html>
